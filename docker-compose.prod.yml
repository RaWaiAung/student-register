# Production stack: frontend + backend only.
# MySQL is NOT part of this file - set it up yourself on the instance (or RDS)
# and point DATABASE_URL in .env.prod at it.
name: student-register-prod

services:
  backend:
    build: ./backend
    image: student-register-backend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
    extra_hosts:
      # lets the container reach MySQL running on the EC2 host via host.docker.internal
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/students >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  frontend:
    build: ./frontend
    image: student-register-frontend:latest
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
