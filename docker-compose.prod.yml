# Production stack (AWS Free Tier friendly): frontend + backend only.
# MySQL runs separately on the instance - see DEPLOY-EC2.md.
name: student-register-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"     # keep logs from filling the small disk
    max-file: "2"

services:
  backend:
    build: ./backend
    image: student-register-backend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=160
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/students >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging
    networks: [internal]

  frontend:
    build: ./frontend
    image: student-register-frontend:latest
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    networks: [internal]

networks:
  internal:
    # shared with the MySQL container you start manually (see DEPLOY-EC2.md)
    name: student-net
    external: true
